name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=7.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Test
        run: dotnet test tests/SteamAchievementManager.Tests -c Release

      - name: Build
        run: dotnet publish src/SteamAchievementManager -c Release -p:Version=${{ env.VERSION }} -p:FileVersion=${{ env.VERSION }} -p:DebugType=none -o publish

      - name: Package
        shell: pwsh
        run: Copy-Item publish/SteamAchievementManager.exe "SteamAchievementManager-$env:VERSION.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: SteamAchievementManager-${{ env.VERSION }}
          path: SteamAchievementManager-*.exe

      - name: Release
        # master pushes get an auto tag v7.0.<run number>; a pushed v* tag is used as-is
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ env.VERSION }}" SteamAchievementManager-${{ env.VERSION }}.exe --target "${{ github.sha }}" --generate-notes --title "v${{ env.VERSION }}"
