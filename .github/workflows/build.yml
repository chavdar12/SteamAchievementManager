name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=7.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: msbuild SAM.sln -restore -m -p:Configuration=Release -p:Platform=x86 -p:Version=${{ env.VERSION }} -p:FileVersion=${{ env.VERSION }}

      - name: Package
        shell: pwsh
        run: |
          Copy-Item LICENSE.txt, README.md upload/
          Compress-Archive -Path upload/*.exe, upload/*.dll, upload/LICENSE.txt, upload/README.md -DestinationPath "SteamAchievementManager-$env:VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SteamAchievementManager-${{ env.VERSION }}
          path: SteamAchievementManager-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" SteamAchievementManager-${{ env.VERSION }}.zip --generate-notes --title "${{ github.ref_name }}"
